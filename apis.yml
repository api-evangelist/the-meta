name: The Meta
description: >-
  The Meta is the gaming-performance company behind KovaaK's Aim Trainer
  (formerly "Kovaak 2.0: The Meta"), a PC esports training platform distributed
  on Steam that pairs guided, skill-specific training modules with Kovaak's
  Sandbox aim trainer and its library of 2,600+ user-generated scenarios. The
  platform lets FPS players measure, diagnose, and improve their mechanical aim
  and in-game habits, feeding back insights on weaknesses so players can target
  their practice. Founded by Duncan Haberly, Jay Brown, and Chris Olson and
  backed by Canaan (Beta Fund), Village Global, Courtside VC, betaworks, GFR,
  and Akatsuki Entertainment Technology (AET Fund). The Meta operates a consumer
  game product, a community wiki, and a Discord community; it does not currently
  publish a public first-party developer API.
